name: Chromatic Visual Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Chromatic
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure AWS credentials (CI account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::238809176525:role/gitHubDeployRole
          aws-region: us-east-1
      
      - name: Assume Amplify read role (et-prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759854655984:role/GitHubActionsRole
          aws-region: us-east-1
          role-chaining: true
      
      - name: Generate Amplify outputs
        run: npx ampx generate outputs --branch main --app-id ${{ secrets.AMPLIFY_APP_ID }}
      
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          autoAcceptChanges: main # Auto-accept changes on main branch
          exitOnceUploaded: true # Don't wait for test results in PRs
          onlyChanged: true # Only test changed stories (faster)
