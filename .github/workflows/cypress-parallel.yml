name: Cypress E2E Tests (Parallel)

# Consolidated test suite (March 2026):
# - complete-workflow.cy.ts: Comprehensive instructor→learner→grading flow
# - onboarding-storybook.cy.ts: Onboarding system in Storybook
# - onboarding-main-ui.cy.ts: Onboarding system in production app
# - workbook-spec.cy.ts: Gold standard workbook test (reference)
#
# Replaced 11 fragile tests with 3 comprehensive suites for better maintainability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: "20"

jobs:
  # Install dependencies once and cache for all test jobs
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

  # Run tests in parallel using matrix strategy
  cypress-tests:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        # Consolidated comprehensive test suite
        spec:
          - cypress/e2e/complete-workflow.cy.ts
          - cypress/e2e/onboarding-storybook.cy.ts
          - cypress/e2e/onboarding-main-ui.cy.ts
          - cypress/e2e/workbook-spec.cy.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (if cache miss)
        run: npm ci

      # Set up test environment variables
      - name: Configure test environment
        run: |
          echo "TEACHER_USERNAME=${{ secrets.TEACHER_USERNAME || 'instructor1@example.com' }}" >> $GITHUB_ENV
          echo "TEACHER_PASSWORD=${{ secrets.TEACHER_PASSWORD || 'TestPassword123!' }}" >> $GITHUB_ENV
          echo "LEARNER_USERNAME=${{ secrets.LEARNER_USERNAME || 'student1@example.com' }}" >> $GITHUB_ENV
          echo "LEARNER_PASSWORD=${{ secrets.LEARNER_PASSWORD || 'TestPassword123!' }}" >> $GITHUB_ENV

      # Build the application
      - name: Build Next.js application
        run: npm run build

      # Start dev server in background
      - name: Start Next.js dev server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          CI: true

      # Start Storybook if testing onboarding-storybook
      - name: Start Storybook (if needed)
        if: contains(matrix.spec, 'onboarding-storybook')
        run: |
          npm run storybook &
          npx wait-on http://localhost:6006 --timeout 60000

      # Run Cypress test for this specific spec
      - name: Run Cypress test - ${{ matrix.spec }}
        uses: cypress-io/github-action@v6
        with:
          install: false # Already installed
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
          spec: ${{ matrix.spec }}
          browser: chrome
        env:
          TEACHER_USERNAME: ${{ env.TEACHER_USERNAME }}
          TEACHER_PASSWORD: ${{ env.TEACHER_PASSWORD }}
          LEARNER_USERNAME: ${{ env.LEARNER_USERNAME }}
          LEARNER_PASSWORD: ${{ env.LEARNER_PASSWORD }}

      # Upload screenshots on failure
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots
          if-no-files-found: ignore

      # Upload videos (if enabled)
      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-${{ strategy.job-index }}
          path: cypress/videos
          if-no-files-found: ignore

  # Aggregate results
  cypress-results:
    needs: cypress-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.cypress-tests.result }}" == "failure" ]; then
            echo "Some Cypress tests failed"
            exit 1
          elif [ "${{ needs.cypress-tests.result }}" == "success" ]; then
            echo "All Cypress tests passed!"
            exit 0
          else
            echo "Tests were cancelled or skipped"
            exit 1
          fi
