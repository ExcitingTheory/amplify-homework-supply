type Section @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Admins", "Instructors"]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read] },
  { allow: public, operations: [read]}
  ]) {
  id: ID!
  name: String
  owner: String
  description: String
  code: String!
  assignments: [Assignment] @hasMany(indexName: "bySection", fields: ["id"])
}

type Assignment @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groupsField: "learner", operations: [read]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read] },
  { allow: groups, groups: ["Instructors", "Admins"], operations: [create, update, delete, read] },
  { allow: public, operations: [read]}
  ]) {
  id: ID!
  due: AWSDateTime
  learner: String
  owner: String
  sectionID: ID @index(name: "bySection")
  grades: [Grade] @hasMany(indexName: "byAssignment", fields: ["id"])
  unitID: ID @index(name: "byUnit")
}

type Grade @model @auth(rules: [
  { allow: groups, groupsField: "instructor", operations: [read]}
  { allow: owner, ownerField: "owner", operations: [create, read]},
  { allow: groups, groups: ["Admins"], operations: [read]}
  ]) {
  id: ID!
  percentComplete: Float
  accuracy: Float
  complete: Boolean
  owner: String
  instructor: String
  identityId: String
  unitVersion: Int
  data: AWSJSON
  feedback: AWSJSON
  files: [String]
  unitID: ID @index(name: "byUnit")
  assignmentID: ID @index(name: "byAssignment")
}

type Query {
  getStudentSubmissionUrl(gradeId: ID!, submissionKey: String!): SubmissionUrl
    @function(name: "getStudentSubmission-${env}")
    @auth(rules: [
      { allow: groups, groups: ["Instructors", "Admins"] }
    ])
}

type SubmissionUrl {
  url: String!
  expiresAt: AWSDateTime!
  metadata: AWSJSON
}

type Unit @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Admins", "Instructors"]},
  { allow: groups, groupsField: "learner", operations: [read]}
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read] },
  { allow: public, operations: [read]}])
  {
  id: ID!
  number: Float
  name: String
  learner: String
  owner: String
  description: String
  data: AWSJSON
  publish: Boolean
  audioFiles: [String]
  videoFiles: [String]
  imageFiles: [String]
  urls: [String]
  assignments: [Assignment] @hasMany(indexName: "byUnit", fields: ["id"])
  words: [Word] @manyToMany(relationName: "UnitWord")
  grades: [Grade] @hasMany(indexName: "byUnit", fields: ["id"])
  analyzedDocuments: [Document] @hasMany(indexName: "byUnit", fields: ["id"])
}

type Word @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Instructors", "Admins"]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read] },
  { allow: public, operations: [read]}]) {
  id: ID!
  phrase: String
  owner: String
  phonetic: String
  definition: String
  audio: [String]
  units: [Unit] @manyToMany(relationName: "UnitWord")
  sourceDocumentID: ID
  approved: Boolean
  importedAt: AWSDateTime
}

type Question @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Instructors", "Admins"]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read] },
  { allow: public, operations: [read]}]) {
  id: ID!
  prompt: String!
  answer: String
  hint: String
  owner: String
  audio: [String]
  unitID: ID @index(name: "byUnit")
  unit: Unit @belongsTo(fields: ["unitID"])
  sourceDocumentID: ID
  approved: Boolean
  importedAt: AWSDateTime
  difficulty: String
  questionType: String
  metadata: AWSJSON
}

type Document @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Instructors", "Admins"], operations: [create, update, delete, read]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read]},
  { allow: groups, groupsField: "learner", operations: [read]},
  { allow: public, operations: [read]}
  ]) {
  id: ID!
  filename: String!
  s3Key: String!
  status: String! # uploaded, extracting, extracted, analyzing, completed, failed
  owner: String
  identityId: String
  learner: String
  unitID: ID @index(name: "byUnit")
  unit: Unit @belongsTo(fields: ["unitID"])
  extractedText: String
  pageCount: Int
  fileSize: Int
  mimeType: String
  uploadedAt: AWSDateTime
  parsedContent: [ParsedContent] @hasMany(indexName: "byDocument", fields: ["id"])
  agentJobs: [AgentJob] @hasMany(indexName: "byDocument", fields: ["id"])
  metadata: AWSJSON
}

type ParsedContent @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Instructors", "Admins"], operations: [create, update, delete, read]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read]},
  { allow: public, operations: [read]}
  ]) {
  id: ID!
  owner: String
  identityId: String
  DocumentID: ID! @index(name: "byDocument")
  Document: Document @hasMany(fields: ["DocumentID"])
  vocabularyJSON: AWSJSON # [{word, definition, context, page}]
  questionsJSON: AWSJSON # [{prompt, answer, hint, difficulty, questionType}]
  summariesJSON: AWSJSON # [{title, content, page_range}]
  objectivesJSON: AWSJSON # [{objective, bloom_level}]
  conceptsJSON: AWSJSON # [{concept, description, related_vocabulary}]
  responseId: String # OpenAI response ID
  modelUsed: String
  tokensUsed: Int
  processingTime: Int
  createdAt: AWSDateTime
  approved: Boolean
  importedAt: AWSDateTime
  metadata: AWSJSON
}

type AgentJob @model @auth(rules: [
  { allow: private, operations: [read]},
  { allow: groups, groups: ["Instructors", "Admins"], operations: [create, update, delete, read]},
  { allow: owner, ownerField: "owner", operations: [create, update, delete, read]},
  { allow: public, operations: [read]}
  ]) {
  id: ID!
  owner: String
  identityId: String
  type: String! # pdf_analysis, exercise_generation, vocabulary_extraction
  status: String! # queued, processing, completed, failed, cancelled
  DocumentID: ID @index(name: "byDocument")
  Document: Document @belongsTo(fields: ["DocumentID"])
  unitID: ID @index(name: "byUnit")
  unit: Unit @belongsTo(fields: ["unitID"])
  responseId: String # OpenAI response ID for tracking
  webhookData: AWSJSON # Raw webhook payload
  error: AWSJSON # {message, code, stack, timestamp}
  startedAt: AWSDateTime
  completedAt: AWSDateTime
  modelUsed: String
  tokensUsed: Int
  estimatedCost: Float
  retryCount: Int
  metadata: AWSJSON
}


