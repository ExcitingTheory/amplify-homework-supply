type AIFeedback @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]},
  {allow: private}])
{
  owner: String
  identityId: String
  contentType: AIFeedbackContentType
  feedbackType: AIFeedbackFeedbackType
  reasons: AIFeedbackReasons
  comment: String
  model: String
  prompt: String
  generatedContent: String
  unitID: ID
  gradeID: ID
  documentID: ID
  messageId: String
  sessionId: String
  metadata: AWSJSON
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

enum UnitStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type UnitEmbedding 
{
  embedding: AWSJSON
  model: String
  dimensions: Int
  version: AWSTimestamp
  wordCount: Int
}

type UnitModeration 
{
  status: String
  flags: AWSJSON
  checkedAt: AWSDateTime
}

enum AssignmentStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type GradeModeration 
{
  status: String
  flags: AWSJSON
  checkedAt: AWSDateTime
}

enum SectionStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type SectionEmbedding 
{
  embedding: AWSJSON
  model: String
  dimensions: Int
  version: AWSTimestamp
  wordCount: Int
}

type QuestionEmbedding 
{
  embedding: AWSJSON
  model: String
  dimensions: Int
  version: AWSTimestamp
  wordCount: Int
}

type QuestionModeration 
{
  status: String
  flags: AWSJSON
  checkedAt: AWSDateTime
}

enum FileLevel {
  PUBLIC
  PRIVATE
  PROTECTED
}

type FileEmbedding 
{
  embedding: AWSJSON
  model: String
  dimensions: Int
  version: AWSTimestamp
  wordCount: Int
}

type WordEmbedding 
{
  embedding: AWSJSON
  model: String
  dimensions: Int
  version: AWSTimestamp
  wordCount: Int
}

type WordModeration 
{
  status: String
  flags: AWSJSON
