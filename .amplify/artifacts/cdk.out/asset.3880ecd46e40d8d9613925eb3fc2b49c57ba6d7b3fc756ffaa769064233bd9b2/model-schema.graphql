  resumeState: AWSJSON
  files: [File] @hasMany(references: ["documentID"])
  parsedContent: [ParsedContent] @hasMany(references: ["documentID"])
  agentJobs: [AgentJob] @hasMany(references: ["documentID"])
  unitDocuments: [UnitDocument] @hasMany(references: ["documentID"])
  documentWords: [DocumentWord] @hasMany(references: ["documentID"])
  documentQuestions: [DocumentQuestion] @hasMany(references: ["documentID"])
  metadata: AWSJSON
}

type ParsedContent @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  owner: String
  identityId: String
  documentID: ID!
  document: Document @belongsTo(references: ["documentID"])
  fileID: ID
  file: File @belongsTo(references: ["fileID"])
  vocabularyJSON: AWSJSON
  summariesJSON: AWSJSON
  objectivesJSON: AWSJSON
  conceptsJSON: AWSJSON
  questionsJSON: AWSJSON
  responseId: String
  modelUsed: String
  tokensUsed: Int
  processingTime: Int
  createdAt: AWSDateTime
  importedAt: AWSDateTime
  metadata: AWSJSON
}

type AgentJob @model @auth(rules: [{allow: owner, ownerField: "owner"},
