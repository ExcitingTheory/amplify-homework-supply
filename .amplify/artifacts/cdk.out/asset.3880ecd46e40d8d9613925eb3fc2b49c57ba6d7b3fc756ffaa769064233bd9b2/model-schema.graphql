type Unit @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  number: Float
  name: String
  description: String
  data: AWSJSON
  status: UnitStatus
  timeLimitSeconds: Int
  assignments: [Assignment] @hasMany(references: ["unitID"])
  grades: [Grade] @hasMany(references: ["unitID"])
  unitFiles: [UnitFile] @hasMany(references: ["unitID"])
  unitWords: [UnitWord] @hasMany(references: ["unitID"])
  questionUnits: [QuestionUnit] @hasMany(references: ["unitID"])
  unitDocuments: [UnitDocument] @hasMany(references: ["unitID"])
  agentJobs: [AgentJob] @hasMany(references: ["unitID"])
  featuredImage: String
  thumbnail: String
  embedding: UnitEmbedding
  moderation: UnitModeration
  publishedAt: AWSTimestamp
  isDraft: Boolean
}

type Assignment @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]},
  {allow: private}])
{
  dueDate: AWSDateTime
  status: AssignmentStatus
  sectionID: ID!
  unitID: ID!
  section: Section @belongsTo(references: ["sectionID"])
  unit: Unit @belongsTo(references: ["unitID"])
  learner: String
  owner: String
}

type Grade @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]},
  {allow: private}])
{
  percentComplete: Float
  accuracy: Float
  timerStarted: Boolean
  complete: Boolean
  data: AWSJSON
  feedback: AWSJSON
  files: [String]
  unitVersion: Int
  unitID: ID!
  unit: Unit @belongsTo(references: ["unitID"])
  instructor: String
  identityId: String
  moderation: GradeModeration
}

type Section @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]},
  {allow: private}])
{
  name: String
  description: String
  status: SectionStatus
  code: String
  assignments: [Assignment] @hasMany(references: ["sectionID"])
  featuredImage: String
  thumbnail: String
  backgroundColor: String
  embedding: SectionEmbedding
  learner: String
  owner: String
  identityId: String
}

type Question @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  owner: String
  identityId: String
  prompt: String
  answer: String
  hint: String
  choices: AWSJSON
  audio: [String]
  audioWaveformData: AWSJSON
  answerAudio: [String]
  answerAudioWaveformData: AWSJSON
  generated: Boolean
  model: String
  promptHex: String
  byPromptHex: String
  thumbnail: String
  difficulty: String
  metadata: String
  importedAt: AWSDateTime
  embedding: QuestionEmbedding
  moderation: QuestionModeration
  questionUnits: [QuestionUnit] @hasMany(references: ["questionID"])
  questionWords: [QuestionWord] @hasMany(references: ["questionID"])
  questionFiles: [QuestionFile] @hasMany(references: ["questionID"])
  documentQuestions: [DocumentQuestion] @hasMany(references: ["questionID"])
}

type File @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  owner: String
  identityId: String
  name: String
  description: String
  prompt: String
  model: String
  variant: String
  mimeType: String
  level: FileLevel
  path: String
  size: Int
  duration: Int
  generated: Boolean
  hex: String
  byHex: String
  thumbnail: String
  waveformData: AWSJSON
  documentID: ID
  document: Document @belongsTo(references: ["documentID"])
  parsedContentID: ID
  unitFiles: [UnitFile] @hasMany(references: ["fileID"])
  wordFiles: [WordFile] @hasMany(references: ["fileID"])
  questionFiles: [QuestionFile] @hasMany(references: ["fileID"])
  chatFiles: [AssistantChatFile] @hasMany(references: ["fileID"])
  parsedContents: [ParsedContent] @hasMany(references: ["fileID"])
  embedding: FileEmbedding
}

type Word @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  owner: String
  identityId: String
  phrase: String
  pronunciation: String
  definition: String
  rubyTags: String
  audio: [String]
  waveformData: AWSJSON
  definitionAudio: [String]
  definitionWaveformData: AWSJSON
  importedAt: AWSDateTime
  embedding: WordEmbedding
  moderation: WordModeration
  unitWords: [UnitWord] @hasMany(references: ["wordID"])
  wordFiles: [WordFile] @hasMany(references: ["wordID"])
  questionWords: [QuestionWord] @hasMany(references: ["wordID"])
  documentWords: [DocumentWord] @hasMany(references: ["wordID"])
}

type UnitFile @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]}])
{
  unitID: ID!
  unit: Unit @belongsTo(references: ["unitID"])
  fileID: ID!
  file: File @belongsTo(references: ["fileID"])
}

type UnitWord @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]}])
{
  unitID: ID!
