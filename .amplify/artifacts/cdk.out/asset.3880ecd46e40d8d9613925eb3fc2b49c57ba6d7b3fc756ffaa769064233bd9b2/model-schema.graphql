enum AIFeedbackContentType {
  CHAT_MESSAGE
  CONTENT_COMPLETION
  AUDIO_GENERATION
  IMAGE_GENERATION
  DOCUMENT_ANALYSIS
  VOCABULARY_EXTRACTION
  TRANSCRIPTION
  IMAGE_DESCRIPTION
  GRADING_FEEDBACK
  BLOCK_SUGGESTION
}

enum AIFeedbackFeedbackType {
  POSITIVE
  NEGATIVE
}

enum AIFeedbackReasons {
  INCORRECT
  INCOMPLETE
  INAPPROPRIATE
  NOT_HELPFUL
  IRRELEVANT
  POOR_QUALITY
  OTHER
}