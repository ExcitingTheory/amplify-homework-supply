  responseId: String
  webhookData: AWSJSON
  error: AWSJSON
  startedAt: AWSDateTime
  completedAt: AWSDateTime
  modelUsed: String
  tokensUsed: Int
  estimatedCost: Float
  retryCount: Int
  metadata: AWSJSON
  identityId: String
}

type AssistantChat @model @auth(rules: [{allow: owner, ownerField: "owner"},
