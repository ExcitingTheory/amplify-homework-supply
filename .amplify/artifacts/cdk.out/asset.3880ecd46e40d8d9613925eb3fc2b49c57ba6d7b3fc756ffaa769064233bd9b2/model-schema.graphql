  document: Document @belongsTo(references: ["documentID"])
  questionID: ID!
  question: Question @belongsTo(references: ["questionID"])
}

type AssistantChatFile @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admins"]}])
{
  chatID: ID!
  chat: AssistantChat @belongsTo(references: ["chatID"])
  fileID: ID!
  file: File @belongsTo(references: ["fileID"])
}

type Document @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["Learners"]},
  {allow: groups, groups: ["Admins"]}])
{
  owner: String
  identityId: String
  learner: String
  filename: String!
