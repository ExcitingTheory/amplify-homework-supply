AWSTemplateFormatVersion: "2010-09-09"
Description: Commit-pinned native vocabulary images and GitHub Actions delivery to Amplify.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  GitHubRepository:
    Type: String
    Default: ExcitingTheory/amplify-homework-supply
  AmplifyAppId:
    Type: String
    Default: djbpx2ijr97fs
  AmplifyServiceRoleName:
    Type: String
    Description: Existing Amplify build service role name, including any IAM path only in its ARN, not here.
  RepositoryName:
    Type: String
    Default: homework-native-vocabulary
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:amplify-${AmplifyAppId}-*
  GitHubImageRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Publish verified commit images before releasing Amplify.
        must:
          - Scope GetBranch to the branch ARN and StartJob, GetJob, StopJob to its job ARNs.
    Properties:
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: PublishImageAndReleaseMain
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishCommitImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt Images.Arn
              - Sid: ReleaseMain
                Effect: Allow
                Action:
                  - amplify:GetBranch
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main
              - Sid: ObserveRelease
                Effect: Allow
                Action:
                  - amplify:StartJob
                  - amplify:GetJob
                  - amplify:StopJob
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/main/jobs/*
  AmplifyImageLookup:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: NativeVocabularyCommitImageLookup
      Roles:
        - !Ref AmplifyServiceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecr:DescribeImages
            Resource: !GetAtt Images.Arn
Outputs:
  GitHubRoleArn:
    Value: !GetAtt GitHubImageRole.Arn
  ImageRepository:
    Value: !Ref Images
  ImageRepositoryUri:
    Value: !GetAtt Images.RepositoryUri
