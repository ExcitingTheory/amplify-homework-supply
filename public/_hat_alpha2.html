.62 65.9 17.81a7.04 7.04 0 0 1 3.03 5.95v30.2c0 3.3-3.9 5.38-6.78 3.75C184.84 95.83 163.1 86 133.8 86a133.57 133.57 0 0 0-63.17 15.98c-2.85 1.56-6.63-.5-6.63-3.75V67.77Z" fill="#F4F4F4"/></svg><pre id="out"></pre><script>
const HATS=["hat","turban","hijab","winterHat1","winterHat02","winterHat03","winterHat04"];
async function run(){
  const res={};
  for(const k of HATS){
    const svgEl=document.getElementById("s-"+k);
    const svgStr=new XMLSerializer().serializeToString(svgEl);
    const blob=new Blob([svgStr],{type:"image/svg+xml"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    await new Promise((res2,rej)=>{img.onload=res2;img.onerror=rej;img.src=url;});
    const canvas=document.getElementById("c-"+k);
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,280,280);
    ctx.drawImage(img,0,0,280,280);
    const data=ctx.getImageData(0,0,280,280).data;
    const isOpaque=(x,y)=>data[(y*280+x)*4+3]>10;
    // For each row, find the widest contiguous opaque run and its x-span
    // then find the row where the opaque width, sampled at 15 x offsets
    // around the presumed centre (100..166), first drops to < 50% coverage
    // after being high (i.e. real opening, not a 1px notch).
    const xs=[]; for(let x=90;x<=176;x+=4) xs.push(x);
    const rows=[];
    for(let y=0;y<280;y++){
      let count=0; for(const x of xs) if(isOpaque(x,y)) count++;
      rows.push(count);
    }
    // find first y (after the row first becomes mostly opaque, >60% of xs)
    // where coverage falls below 30% and stays low for next 5 rows (real opening)
    let sawMostlyOpaque=false; let openingY=null;
    for(let y=0;y<280;y++){
      const frac=rows[y]/xs.length;
      if(frac>0.6) sawMostlyOpaque=true;
      if(sawMostlyOpaque && frac<0.3){
        const nextFew=rows.slice(y,y+6).map(c=>c/xs.length);
        if(nextFew.every(f=>f<0.5)){ openingY=y; break; }
      }
    }
    res[k]={openingY, sample: rows.filter((_,y)=>y%10===0).map((c,i)=>[i*10,c])};
  }
  document.getElementById("out").textContent=JSON.stringify(res);
  document.title="ALPHA2_READY";
}
run();
</script></body></html>
