<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f4f8" rx="8"/>
  <text x="200" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1a365d" font-weight="bold">Water Cycle Diagram</text>
  
  <!-- Sun -->
  <circle cx="60" cy="60" r="30" fill="#f6e05e" stroke="#d69e2e" stroke-width="2"/>
  <line x1="60" y1="20" x2="60" y2="10" stroke="#d69e2e" stroke-width="2"/>
  <line x1="90" y1="35" x2="98" y2="28" stroke="#d69e2e" stroke-width="2"/>
  <line x1="30" y1="35" x2="22" y2="28" stroke="#d69e2e" stroke-width="2"/>
  
  <!-- Cloud -->
  <ellipse cx="280" cy="70" rx="60" ry="30" fill="#bee3f8" stroke="#63b3ed" stroke-width="2"/>
  <ellipse cx="260" cy="60" rx="40" ry="25" fill="#bee3f8"/>
  <ellipse cx="300" cy="60" rx="35" ry="20" fill="#bee3f8"/>
  
  <!-- Rain drops -->
  <line x1="260" y1="100" x2="255" y2="130" stroke="#3182ce" stroke-width="2"/>
  <line x1="280" y1="105" x2="275" y2="135" stroke="#3182ce" stroke-width="2"/>
  <line x1="300" y1="100" x2="295" y2="130" stroke="#3182ce" stroke-width="2"/>
  
  <!-- Mountain -->
  <polygon points="150,280 220,150 290,280" fill="#68d391" stroke="#38a169" stroke-width="2"/>
  <polygon points="200,280 260,170 320,280" fill="#48bb78" stroke="#38a169" stroke-width="2"/>
  
  <!-- Water body -->
  <ellipse cx="200" cy="270" rx="180" ry="25" fill="#63b3ed" opacity="0.6"/>
  
  <!-- Evaporation arrows -->
  <path d="M120,250 C120,200 140,180 160,120" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="90" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e53e3e">Evaporation</text>
  <text x="250" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3182ce">Precipitation</text>
  <text x="280" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b6cb0">Condensation</text>
</svg>
