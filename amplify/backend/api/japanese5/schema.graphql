  files: [File] @manyToMany(relationName: "WordFile")
  questions: [Question] @manyToMany(relationName: "QuestionWord")
  documents: [Document] @manyToMany(relationName: "DocumentWord")
  # Content moderation fields
  moderationStatus: String # "pending", "approved", "flagged", or null
  moderationFlags: AWSJSON # Categories flagged by OpenAI moderation API
  moderationCheckedAt: AWSDateTime # Last moderation check timestamp
}

type PageEmbedding {
  page: Int!
  embedding: [Float!]!
  text: String
}

type Document @model  @auth(
    rules: [
      { allow: owner },
      { allow: groups, groups: ["Learners"], operations: [read] },
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID!
  filename: String!
  s3Key: String!
  status: String! # uploaded, extracting, extracted, analyzing, completed, failed
  owner: String
  identityId: String
  learner: String
  extractedText: String
  pageCount: Int
  fileSize: Int
  mimeType: String
  uploadedAt: AWSDateTime
  resumeState: AWSJSON # State for resuming long-running operations (PDF extraction, analysis)
  pageEmbeddings: [PageEmbedding] # Page-level embeddings for semantic search
  embeddingsS3Key: String # S3 key for full embeddings JSON backup
  parsedContent: [ParsedContent] @hasMany(indexName: "byDocument", fields: ["id"])
  agentJobs: [AgentJob] @hasMany(indexName: "byDocument", fields: ["id"])
  metadata: AWSJSON
  units: [Unit] @manyToMany(relationName: "UnitDocument")
  words: [Word] @manyToMany(relationName: "DocumentWord")
  questions: [Question] @manyToMany(relationName: "DocumentQuestion")
}

type ParsedContent @model @auth(
    rules: [
      { allow: owner },
      { allow: groups, groups: ["Learners"], operations: [read] },
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID!
  owner: String
  identityId: String
  documentID: ID! @index(name: "byDocument")
  document: Document @belongsTo(fields: ["documentID"])
  fileID: ID @index(name: "byFile")
  file: File @belongsTo(fields: ["fileID"])
  vocabularyJSON: AWSJSON # [{word, definition, context, page}]
  summariesJSON: AWSJSON # [{title, content, page_range}]
  objectivesJSON: AWSJSON # [{objective, bloom_level}]
  conceptsJSON: AWSJSON # [{concept, description, related_vocabulary}]
  questionsJSON: AWSJSON # [{question, expectedAnswer, hint, type}]
  responseId: String # OpenAI response ID
  modelUsed: String
  tokensUsed: Int
  processingTime: Int
  createdAt: AWSDateTime
  importedAt: AWSDateTime
  metadata: AWSJSON
}

type AgentJob @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Learners"], operations: [read] },
  { allow: groups, groups: ["Admins"] },
  { allow: private, provider: identityPool }
  ]) {
  id: ID!
  owner: String
  identityId: String
  type: String! # pdf_analysis, exercise_generation, vocabulary_extraction
  status: String! # queued, processing, completed, failed, cancelled
  documentID: ID @index(name: "byDocument")
  document: Document @belongsTo(fields: ["documentID"])
  unitID: ID @index(name: "byUnit")
  unit: Unit @belongsTo(fields: ["unitID"])
  responseId: String # OpenAI response ID for tracking
  webhookData: AWSJSON # Raw webhook payload
  error: AWSJSON # {message, code, stack, timestamp}
  startedAt: AWSDateTime
  completedAt: AWSDateTime
  modelUsed: String
  tokensUsed: Int
  estimatedCost: Float
  retryCount: Int
  metadata: AWSJSON
}

type Settings @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Admins"] },
  { allow: private, provider: identityPool }
  ]) {
  id: ID!
  owner: String
  identityId: String
  # Document Analysis Settings
  autoAnalyzeDocuments: Boolean # Automatically analyze documents on upload
  documentAnalysisModel: String # OpenAI model to use (default: gpt-4)
  # Editor Settings
  editorTheme: String # light, dark, auto
  editorFontSize: Int
  # AI Assistant Settings
  defaultAIModel: String
  assistantVoice: String # shimmer, alloy, echo, etc.
  # Notification Settings
  emailNotifications: Boolean
  webhookNotifications: Boolean
  # Other Settings
  language: String # en, ja, etc.
  timezone: String
  metadata: AWSJSON # For additional settings
  updatedAt: AWSDateTime
}

enum AiFeedbackType {
  POSITIVE # thumbs up
  NEGATIVE # thumbs down
}

enum AiFeedbackReason {
  INCORRECT # Content is factually wrong
  INCOMPLETE # Content is missing important information
  INAPPROPRIATE # Content is offensive or inappropriate
  NOT_HELPFUL # Content doesn't answer the question
  IRRELEVANT # Content is off-topic
  POOR_QUALITY # Low quality output (grammar, formatting, etc.)
  OTHER # Other reason (see comment field)
}

enum AiContentType {
  CHAT_MESSAGE # AI assistant chat response
  CONTENT_COMPLETION # Editor content completion suggestion
  AUDIO_GENERATION # Generated audio file
  IMAGE_GENERATION # Generated image file
  DOCUMENT_ANALYSIS # PDF/document analysis results
  VOCABULARY_EXTRACTION # Extracted vocabulary
  TRANSCRIPTION # Audio transcription
  IMAGE_DESCRIPTION # Image description/analysis
  GRADING_FEEDBACK # Automated feedback on student work
  BLOCK_SUGGESTION # AI-suggested content blocks
}

type AIFeedback @model @auth(rules: [
  { allow: owner },
  { allow: groups, groups: ["Admins"] },
  { allow: private, provider: identityPool }
  ]) {
  id: ID!
  owner: String
  identityId: String
  # What type of AI content was this?
  contentType: AiContentType!
  # Positive or negative feedback
  feedbackType: AiFeedbackType!
  # Optional reason(s) for negative feedback
  reasons: [AiFeedbackReason]
  # Optional free-form comment
  comment: String
  # Metadata about the AI generation
  model: String # e.g., "gpt-4", "whisper-1", "dall-e-3"
  prompt: String # The prompt that generated this content
  generatedContent: String # The actual content that was generated
  # Context about where this feedback was given
  unitID: ID @index(name: "byUnit")
  gradeID: ID @index(name: "byGrade")
  documentID: ID @index(name: "byDocument")
  # For chat messages, store the message ID
  messageId: String
  # Session tracking
  sessionId: String # Group related feedback together
  # Additional context
  metadata: AWSJSON # Any additional context about the generation
  # Timestamps
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}


